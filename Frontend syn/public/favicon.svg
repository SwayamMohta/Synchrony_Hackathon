  <ellipse cx="22.5" cy="26" rx="5" ry="8" fill="#e2e8f0" transform="rotate(-20 22.5 26)" opacity="0.35"/>
  <ellipse cx="22.5" cy="42" rx="5" ry="8" fill="#e2e8f0" transform="rotate(20 22.5 42)" opacity="0.35"/>
